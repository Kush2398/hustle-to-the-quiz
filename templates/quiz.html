<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Event | HUSTLE TO THE QUIZ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071426;color:#eef4ff;font-family:Arial;padding:18px}.wrap{max-width:1000px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:900}.score{background:#12243d;border:1px solid #29405f;padding:10px 14px;border-radius:12px;font-weight:900}.card{background:#101f35;border:1px solid #29405f;border-radius:25px;padding:30px}.state{text-align:center;color:#9fb2ce;font-weight:800}.qnum{text-align:center;color:#7191ba;font-weight:900;margin:10px}.question{font-size:32px;text-align:center;line-height:1.3;font-weight:900;white-space:pre-wrap;margin:25px auto 30px}.symbols{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.symbol{height:110px;border:1px solid #385273;background:#142943;color:white;border-radius:18px;font-size:50px;font-weight:900;cursor:pointer}.symbol:hover{border-color:#6d99ff}.symbol:disabled{opacity:.5}.msg{text-align:center;margin-top:18px;color:#9fb2ce}.leader{margin-top:18px;text-align:center}.btn{height:44px;border:1px solid #304967;background:#12243d;color:#fff;border-radius:11px;padding:0 16px;font-weight:900;cursor:pointer}@media(max-width:650px){.symbols{grid-template-columns:repeat(2,1fr)}.question{font-size:24px}}
</style></head><body><main class="wrap"><header class="top"><div><div class="brand">HUSTLE TO THE QUIZ</div><div id="eventName">LIVE EVENT</div></div><div class="score">SCORE: <span id="score">0</span></div></header><section class="card"><div id="state" class="state">Waiting...</div><div id="qnum" class="qnum"></div><div id="question" class="question">Waiting for the admin to start an event.</div><div id="symbols" class="symbols">
<button class="symbol" data-option="1">◆</button><button class="symbol" data-option="2">●</button><button class="symbol" data-option="3">▲</button><button class="symbol" data-option="4">■</button></div><div id="msg" class="msg"></div><div class="leader"><button class="btn" onclick="location.href='/leaderboard'">🏆 LEADERBOARD</button><button class="btn" onclick="location.href='/dashboard'">DASHBOARD</button></div></section></main>
<script>
let lastQ=null,locked=false,finalShown=false;
const buttons=[...document.querySelectorAll(".symbol")];
buttons.forEach(b=>b.onclick=()=>answer(Number(b.dataset.option)));
async function answer(opt){if(locked||!lastQ)return;locked=true;buttons.forEach(b=>b.disabled=true);
try{const r=await fetch("/api/quiz/answer",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question_id:lastQ,selected_option:opt})});const x=await r.json();if(!r.ok||!x.success)throw Error(x.message||"Unable to submit answer");document.getElementById("score").textContent=x.score;document.getElementById("msg").textContent=x.correct?"Correct! +1":"Wrong! +0";}catch(e){document.getElementById("msg").textContent=e.message}
}
async function update(){try{const r=await fetch("/api/quiz/state"),x=await r.json();if(!x.success)return;
document.getElementById("eventName").textContent=x.event_name||"LIVE EVENT";
if(x.active&&x.current_question){finalShown=false;lastQ=x.current_question.id;locked=false;buttons.forEach(b=>b.disabled=false);document.getElementById("state").textContent="LIVE • "+x.event_name;document.getElementById("qnum").textContent=`QUESTION ${x.current_number} OF ${x.total}`;document.getElementById("question").textContent=x.current_question.question;return}
if(x.results_visible){location.href="/leaderboard";return}
document.getElementById("state").textContent="WAITING FOR NEXT EVENT";document.getElementById("question").textContent="Please wait for the admin to start the next challenge.";buttons.forEach(b=>b.disabled=true);loadScore()
}catch(e){}}
async function loadScore(){try{const r=await fetch("/api/my-score"),x=await r.json();if(x.success)document.getElementById("score").textContent=x.score}catch(e){}}
update();loadScore();setInterval(update,900);
</script></body></html>
