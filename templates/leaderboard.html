<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leaderboard | HUSTLE TO THE QUIZ</title>
<style>*{box-sizing:border-box}body{margin:0;background:#071426;color:#eef4ff;font-family:Arial;padding:18px}.wrap{max-width:1000px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top p{color:#8fa5c2}.btn{height:44px;border:1px solid #304967;background:#12243d;color:#fff;border-radius:11px;padding:0 15px;font-weight:900}.bar{display:flex;gap:10px;margin-bottom:15px}.bar input{flex:1;height:44px;border:1px solid #385273;background:#edf4ff;border-radius:11px;padding:0 14px}.box{background:#101f35;border:1px solid #29405f;border-radius:22px;padding:20px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:14px;border-bottom:1px solid #29405f}th{font-size:12px;color:#8fa5c2}.rank{font-weight:900}.me{background:#162d4b}.mine{margin-bottom:15px;background:#12243d;border-radius:12px;padding:14px;color:#cfe0f6}.podium{display:flex;gap:12px;margin-bottom:15px}.pod{flex:1;text-align:center;background:#12243d;border-radius:15px;padding:15px;font-weight:900}@media(max-width:650px){.top{gap:10px;align-items:flex-start}.bar{flex-direction:column}.podium{flex-direction:column}}
</style></head><body><main class="wrap"><header class="top"><div><h1>🏆 LEADERBOARD</h1><p id="sub">Live ranking • search your enrollment</p></div><button class="btn" onclick="location.href='/dashboard'">DASHBOARD</button></header>
<div class="bar"><input id="search" placeholder="Search your rank by enrollment number"><button class="btn" onclick="findRank()">SEARCH</button></div><div id="mine"></div><div id="podium" class="podium"></div><section class="box"><div id="content">Loading...</div></section></main>
<script>
let rows=[],total=0;
function esc(v){const d=document.createElement("div");d.textContent=v??"";return d.innerHTML}
async function load(){try{const r=await fetch("/api/leaderboard"),x=await r.json();if(!x.success)return;rows=x.results||[];total=x.total_questions||0;render()}catch(e){}}
function render(){document.getElementById("podium").innerHTML=rows.slice(0,3).map((p,i)=>`<div class="pod">#${i+1}<br>${esc(p.name)}<br>${p.score} pts</div>`).join("");document.getElementById("content").innerHTML=rows.length?`<table><thead><tr><th>RANK</th><th>NAME</th><th>ENROLLMENT</th><th>SCORE</th></tr></thead><tbody>${rows.map(p=>`<tr><td class="rank">#${p.rank}</td><td>${esc(p.name)}</td><td>${esc(p.enrollment)}</td><td><b>${p.score}</b></td></tr>`).join("")}</tbody></table>`:"No participants yet."}
function findRank(){let q=document.getElementById("search").value.trim().toLowerCase(),p=rows.find(x=>String(x.enrollment).toLowerCase()===q);document.getElementById("mine").innerHTML=p?`<div class="mine">Your rank: <b>#${p.rank}</b> • ${esc(p.name)} • Score: <b>${p.score}</b>`:"<div class='mine'>Enrollment not found.</div>"}
document.getElementById("search").addEventListener("keydown",e=>e.key==="Enter"&&findRank());load();setInterval(load,1200);
</script></body></html>
