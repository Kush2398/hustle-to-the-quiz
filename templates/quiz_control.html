<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz Control | Hustle to the Quiz</title><style>*{box-sizing:border-box;margin:0;padding:0}body{padding:20px;background:#f4f4f4;color:#111;font-family:Arial}.page{max-width:900px;margin:auto}.top,.panel{background:#fff;border-radius:12px;box-shadow:0 5px 20px rgba(0,0,0,.05)}.top{padding:25px 30px;display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.top p{color:#666;margin-top:5px;font-size:14px}h1{font-size:27px}.panel{padding:30px;text-align:center}.state{font-size:15px;color:#666;margin-bottom:20px}.number{font-size:52px;font-weight:700;margin-bottom:15px}.buttons{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.btn{height:48px;padding:0 22px;border:0;border-radius:7px;background:#111;color:#fff;font-weight:600;cursor:pointer}.outline{background:#fff;color:#111;border:1px solid #ccc}.btn:disabled{opacity:.45;cursor:not-allowed}.notice{margin-top:18px;color:#555;font-size:14px;min-height:20px}.link{margin-top:22px;color:#666;font-size:14px}.link a{color:#111;font-weight:600}@media(max-width:700px){.top{flex-direction:column;align-items:flex-start}.buttons{flex-direction:column}.btn{width:100%}}</style></head><body><main class="page"><header class="top"><div><h1>Quiz Control</h1><p>Control the live Level 1 quiz.</p></div><button class="btn outline" onclick="location.href='/admin'">← DASHBOARD</button></header><section class="panel"><div id="state" class="state">Checking quiz...</div><div id="number" class="number">—</div><div class="buttons"><button id="start" class="btn" onclick="startQuiz()">START NEW QUIZ</button><button id="next" class="btn" onclick="nextQuestion()">NEXT QUESTION</button><button id="stop" class="btn outline" onclick="stopQuiz()">STOP QUIZ</button></div><div id="notice" class="notice"></div><p class="link">Open the projector display: <a href="/quiz-board" target="_blank">QUIZ BOARD</a></p></section></main><script>
async function state(){try{const r=await fetch('/api/quiz/state');const x=await r.json();if(r.status===401){location.href='/';return}if(!x.success)return;document.getElementById('state').textContent=x.completed?'QUIZ COMPLETED • FINAL RESULTS ARE LIVE':x.active?'QUIZ LIVE • Question '+x.current_number+' of '+x.total:'Quiz is stopped.';document.getElementById('number').textContent=x.active?x.current_number+' / '+x.total:x.completed?'RESULTS':'—';document.getElementById('start').disabled=x.active;document.getElementById('next').disabled=!x.active;document.getElementById('stop').disabled=!x.active}catch(e){}}
async function call(url){try{const r=await fetch(url,{method:'POST'});const x=await r.json();if(r.status===401){location.href='/';return}document.getElementById('notice').textContent=x.message||'Done';if(!r.ok||!x.success)alert(x.message||'Action failed');state()}catch(e){alert('Connection error.')}}
function startQuiz(){if(confirm('Start a new quiz? Previous scores will be cleared.'))call('/api/quiz/start')}function nextQuestion(){call('/api/quiz/next')}function stopQuiz(){if(confirm('Stop the live quiz? Final results will stay hidden.'))call('/api/quiz/stop')}state();setInterval(state,1000);
</script></body></html>
