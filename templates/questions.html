<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Questions</title>
<style>*{box-sizing:border-box}body{margin:0;background:#071426;color:#eef4ff;font-family:Arial;padding:22px}.wrap{max-width:1150px;margin:auto}.top,.toolbar,.item{background:#101f35;border:1px solid #29405f;border-radius:20px;padding:22px;margin-bottom:16px}.top,.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center}.select{height:44px;border-radius:10px;padding:0 12px;min-width:250px}.btn{height:42px;border:0;border-radius:10px;padding:0 14px;background:#5d8df6;color:#fff;font-weight:900;cursor:pointer}.dark{background:#12243d;border:1px solid #304967}.danger{background:#8f2c3b}.item .q{font-size:18px;font-weight:800;margin:10px 0}.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opt{padding:11px;border:1px solid #304967;border-radius:9px}.correct{border-color:#53d49a;background:#103529}.actions{margin-top:12px;display:flex;gap:8px}.overlay{display:none;position:fixed;inset:0;background:#0009;place-items:center;padding:20px}.overlay.show{display:grid}.modal{width:min(700px,100%);max-height:90vh;overflow:auto;background:#101f35;border:1px solid #385273;border-radius:20px;padding:24px}.field{margin:10px 0}.field input,.field textarea,.field select{width:100%;padding:11px;border-radius:9px;border:1px solid #385273}.field textarea{min-height:90px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:700px){.opts,.grid{grid-template-columns:1fr}.top,.toolbar{flex-direction:column;align-items:stretch}}
</style></head><body><main class="wrap"><header class="top"><div><h1>Question Manager</h1><div>Add, edit, delete and bulk import questions.</div></div><button class="btn dark" onclick="location.href='/admin'">DASHBOARD</button></header><section class="toolbar"><select id="eventFilter" class="select"></select><div><button class="btn" onclick="openM()">ADD QUESTION</button><button class="btn dark" onclick="openBulk()">BULK ADD</button></div></section><section id="list"></section></main>
<div id="overlay" class="overlay"><div class="modal"><h2 id="title">Add Question</h2><form id="form"><div class="field"><label>Event</label><select id="eventId"></select></div><div class="field"><textarea id="question" placeholder="Question"></textarea></div><div class="grid"><div class="field"><input id="o1" placeholder="Option 1"></div><div class="field"><input id="o2" placeholder="Option 2"></div><div class="field"><input id="o3" placeholder="Option 3"></div><div class="field"><input id="o4" placeholder="Option 4"></div></div><div class="grid"><div class="field"><select id="difficulty"><option>Easy</option><option selected>Medium</option><option>Hard</option></select></div><div class="field"><input id="time" type="number" value="20" min="5" max="300"></div></div><div class="field"><label>Correct option</label><select id="correct"><option value="1">Option 1</option><option value="2">Option 2</option><option value="3">Option 3</option><option value="4">Option 4</option></select></div><button class="btn">SAVE</button> <button type="button" class="btn dark" onclick="closeM()">CANCEL</button></form></div></div>
<div id="bulk" class="overlay"><div class="modal"><h2>Bulk Add</h2><p>Use an array of objects. Each object must include event_id, question, option_1..4, correct_option, difficulty and time_limit.</p><textarea id="bulkText" style="width:100%;min-height:300px"></textarea><button class="btn" onclick="submitBulk()">IMPORT</button> <button class="btn dark" onclick="closeBulk()">CANCEL</button></div></div>
<script>
let editing=null;
function esc(v){const d=document.createElement("div");d.textContent=v??"";return d.innerHTML}
async function events(){const r=await fetch("/api/events"),x=await r.json();if(!x.success)return;eventFilter.innerHTML='<option value="">ALL EVENTS</option>'+x.events.map(e=>`<option value="${e.id}">${e.event_name}</option>`).join("");eventId.innerHTML=x.events.map(e=>`<option value="${e.id}">${e.event_name}</option>`).join("");load()}
eventFilter.onchange=load;
async function load(){let u="/api/questions"+(eventFilter.value?"?event_id="+eventFilter.value:""),r=await fetch(u),x=await r.json();if(!x.success)return;list.innerHTML=x.questions.length?x.questions.map((q,i)=>`<article class="item"><small>${esc(q.event_name)} • ${q.difficulty} • ${q.time_limit}s</small><div class="q">${esc(q.question)}</div><div class="opts">${[1,2,3,4].map(n=>`<div class="opt ${q.correct_option===n?'correct':''}"><b>${n}.</b> ${esc(q["option_"+n])}</div>`).join("")}</div><div class="actions"><button class="btn" onclick='editQ(${JSON.stringify(q)})'>EDIT</button><button class="btn danger" onclick="delQ(${q.id})">DELETE</button></div></article>`).join(""):"<div class='item'>No questions for this selection.</div>"}
function openM(){editing=null;form.reset();title.textContent="Add Question";overlay.classList.add("show")}
function editQ(q){editing=q.id;title.textContent="Edit Question";eventId.value=q.event_id;question.value=q.question;o1.value=q.option_1;o2.value=q.option_2;o3.value=q.option_3;o4.value=q.option_4;difficulty.value=q.difficulty;time.value=q.time_limit;correct.value=q.correct_option;overlay.classList.add("show")}
function closeM(){overlay.classList.remove("show")}
form.onsubmit=async e=>{e.preventDefault();let body={event_id:Number(eventId.value),question:question.value,option_1:o1.value,option_2:o2.value,option_3:o3.value,option_4:o4.value,correct_option:Number(correct.value),difficulty:difficulty.value,time_limit:Number(time.value)};let r=await fetch(editing?"/api/questions/"+editing:"/api/questions",{method:editing?"PUT":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}),x=await r.json();if(!r.ok||!x.success)return alert(x.message||"Save failed");closeM();load()}
async function delQ(id){if(!confirm("Delete question?"))return;let r=await fetch("/api/questions/"+id,{method:"DELETE"}),x=await r.json();if(!r.ok||!x.success)return alert(x.message||"Delete failed");load()}
function openBulk(){bulk.classList.add("show")}function closeBulk(){bulk.classList.remove("show")}
async function submitBulk(){try{let arr=JSON.parse(bulkText.value);let r=await fetch("/api/questions/bulk",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({questions:arr})}),x=await r.json();if(!r.ok||!x.success)throw Error(x.message||"Import failed");alert(`${x.added} questions added${x.errors.length?"\n"+x.errors.join("\n"):""}`);closeBulk();load()}catch(e){alert(e.message)}}
events();
</script></body></html>
