<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Results</title>
<style>*{box-sizing:border-box}body{margin:0;background:#071426;color:#eef4ff;font-family:Arial;padding:22px}.wrap{max-width:1100px;margin:auto}.top,.box{background:#101f35;border:1px solid #29405f;border-radius:20px;padding:22px;margin-bottom:16px}.top{display:flex;justify-content:space-between}.btn{height:42px;border:1px solid #304967;background:#12243d;color:#fff;border-radius:10px;padding:0 14px;font-weight:900}.table{width:100%;border-collapse:collapse;min-width:750px}.table th,.table td{padding:13px;border-bottom:1px solid #29405f;text-align:left}.table th{color:#8fa5c2;font-size:12px}.score{font-weight:900}
</style></head><body><main class="wrap"><header class="top"><div><h1>Results</h1><div>Current leaderboard from MySQL.</div></div><button class="btn" onclick="location.href='/admin'">DASHBOARD</button></header><section class="box"><div id="content">Loading...</div></section></main>
<script>
function esc(v){const d=document.createElement("div");d.textContent=v??"";return d.innerHTML}
async function load(){try{let r=await fetch("/api/leaderboard"),x=await r.json();if(!x.success)throw Error(x.message);content.innerHTML=x.results.length?`<div style="overflow:auto"><table class="table"><thead><tr><th>RANK</th><th>NAME</th><th>ENROLLMENT</th><th>COLLEGE</th><th>SCORE</th><th>ANSWERED</th></tr></thead><tbody>${x.results.map(p=>`<tr><td>#${p.rank}</td><td>${esc(p.name)}</td><td>${esc(p.enrollment)}</td><td>${esc(p.college)}</td><td class="score">${p.score}</td><td>${p.answered}</td></tr>`).join("")}</tbody></table></div>`:"No participants yet."}catch(e){content.textContent=e.message}}
load();setInterval(load,1500)
</script></body></html>
