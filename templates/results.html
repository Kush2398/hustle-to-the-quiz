<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Results | Hustle to the Quiz</title><style>*{box-sizing:border-box;margin:0;padding:0}body{padding:20px;background:#f4f4f4;font-family:Arial;color:#111}.page{max-width:1100px;margin:auto}.top,.box{background:#fff;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.05)}.top{padding:25px 30px;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:15px}h1{font-size:27px}.top p{color:#666;margin-top:5px;font-size:14px}.btn{height:43px;padding:0 17px;border:1px solid #ccc;border-radius:7px;background:#fff;font-weight:600;cursor:pointer}.box{padding:20px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:13px;text-align:left;border-bottom:1px solid #e5e5e5;font-size:14px}th{background:#f7f7f7;font-size:13px}.empty{text-align:center;color:#777;padding:45px}.score{text-align:right;font-weight:800}.status{text-align:center;padding:12px;margin-bottom:15px;border-radius:8px;background:#f7f7f7;color:#666}</style></head><body><main class="page"><header class="top"><div><h1>Results & Leaderboard</h1><p>Admin view of participant scores.</p></div><button class="btn" onclick="location.href='/admin'">← DASHBOARD</button></header><section class="box"><div id="status" class="status">Loading...</div><div id="content" class="empty">Loading results...</div></section></main><script>
const esc=v=>{const d=document.createElement('div');d.textContent=v??'';return d.innerHTML};async function load(){try{const r=await fetch('/api/results');const x=await r.json();if(r.status===401){location.href='/';return}if(!r.ok||!x.success)throw Error(x.message||'Unable to load results');document.getElementById('status').textContent=x.completed?'Final results are public on the board and all student phones.':x.active?'Quiz is live. Admin can see current scores; public final results are hidden.':'Quiz has not been completed yet.';if(!x.results.length){document.getElementById('content').textContent='No participants yet.';return}document.getElementById('content').className='';document.getElementById('content').innerHTML='<table><thead><tr><th>Rank</th><th>Name</th><th>Enrollment</th><th>College</th><th>Correct</th><th>Answered</th><th>Score</th></tr></thead><tbody>'+x.results.map(p=>'<tr><td><b>'+p.rank+'</b></td><td>'+esc(p.name)+'</td><td>'+esc(p.enrollment)+'</td><td>'+esc(p.college)+'</td><td>'+p.correct+'</td><td>'+p.answered+'</td><td class="score">'+p.score+(x.total_questions?' / '+x.total_questions:'')+'</td></tr>').join('')+'</tbody></table>'}catch(e){document.getElementById('content').textContent=e.message}}load();setInterval(load,2000);
</script></body></html>
