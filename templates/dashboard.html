<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard | HUSTLE TO THE QUIZ</title><style>
*{box-sizing:border-box}body{margin:0;background:#071426;color:#eef4ff;font-family:Arial;padding:24px}.wrap{max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.brand{font-weight:900;font-size:22px}.sub{color:#8fa5c2;margin-top:5px}.actions{display:flex;gap:10px}.btn{border:1px solid #304967;background:#12243d;color:#fff;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}.hero{background:linear-gradient(135deg,#122844,#0e1d31);border:1px solid #29415f;border-radius:25px;padding:30px;margin-bottom:24px}.hero h1{font-size:42px;margin:0 0 8px}.hero p{color:#a7bad3}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.event{background:#101f35;border:1px solid #29405f;border-radius:22px;padding:24px;transition:.2s}.event:hover{transform:translateY(-2px);border-color:#5d8df6}.num{font-size:12px;color:#7593b8;font-weight:900;letter-spacing:1px}.event h2{margin:9px 0;font-size:23px}.event p{color:#9fb2ce;min-height:42px}.badge{display:inline-block;padding:7px 10px;border-radius:99px;font-size:12px;font-weight:900;background:#1c2e46;color:#9fb2ce}.live{background:#123d31;color:#6ff0b7}.done{background:#25344a;color:#cbd8e9}.enter{margin-top:18px;width:100%;height:46px;border:0;border-radius:11px;background:#5d8df6;color:#fff;font-weight:900;cursor:pointer}.locked{opacity:.72}.bottom{display:flex;gap:12px;margin-top:20px}.bottom .btn{flex:1;text-align:center}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;gap:15px}.hero h1{font-size:32px}.actions{flex-direction:column}}
</style></head><body><main class="wrap"><header class="top"><div><div class="brand">HUSTLE TO THE QUIZ</div><div class="sub">Welcome, {{student_name}}</div></div><div class="actions"><button class="btn" onclick="location.href='/leaderboard'">🏆 LEADERBOARD</button><button class="btn" onclick="location.href='/logout'">EXIT</button></div></header>
<section class="hero"><h1>YOUR 5 CHALLENGES</h1><p>Each event is activated by the admin. Complete every challenge to build your overall score.</p></section>
<section id="events" class="grid"></section><div class="bottom"><button class="btn" onclick="location.href='/quiz'">ENTER LIVE EVENT</button><button class="btn" onclick="location.href='/leaderboard'">VIEW RANK</button></div></main>
<script>
async function load(){try{const r=await fetch("/api/events"),x=await r.json();if(!x.success)return;document.getElementById("events").innerHTML=x.events.map((e,i)=>{
let live=e.status==="LIVE",done=e.status==="COMPLETED";return `<article class="event ${live?'':'locked'}"><div class="num">EVENT ${i+1}</div><h2>${esc(e.event_name)}</h2><p>${esc(e.description||"")}</p><span class="badge ${live?'live':done?'done':''}">${live?'● LIVE NOW':done?'✓ COMPLETED':'🔒 NOT STARTED'}</span>${live?'<button class="enter" onclick="location.href=\\'/quiz\\'">ENTER EVENT →</button>':''}</article>`}).join("")}catch(e){}}
function esc(v){const d=document.createElement("div");d.textContent=v??"";return d.innerHTML}load();setInterval(load,1500);
</script></body></html>
