<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hustle to the Quiz</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#f4f4f4;color:#111;font-family:Arial,Helvetica,sans-serif}
.card{width:100%;max-width:430px;background:#fff;padding:36px;border-radius:14px;box-shadow:0 10px 35px rgba(0,0,0,.08)}
h1{text-align:center;font-size:30px;margin-bottom:8px}
.subtitle{text-align:center;color:#666;margin-bottom:30px}
.group{margin-bottom:20px}
label{display:block;font-weight:600;font-size:15px;margin-bottom:8px}
input{width:100%;height:48px;padding:0 14px;border:1px solid #ccc;border-radius:7px;font-size:15px;outline:none}
input:focus{border-color:#111;box-shadow:0 0 0 3px rgba(0,0,0,.07)}
button{width:100%;height:50px;border:0;border-radius:7px;background:#111;color:#fff;font-weight:600;font-size:16px;cursor:pointer}
button:hover{background:#222}
button:disabled{opacity:.6;cursor:not-allowed}
.info{margin-top:18px;text-align:center;color:#777;font-size:13px;line-height:1.5}
.message{display:none;margin-top:16px;padding:11px;border-radius:7px;text-align:center;font-size:14px}
.message.show{display:block}
.error{background:#fff1f1;color:#b42318;border:1px solid #efb8b8}
.success{background:#eef8f0;color:#216e39;border:1px solid #b8dfc1}
@media(max-width:500px){.card{padding:28px 22px}h1{font-size:26px}}
</style>
</head>
<body>
<main class="card">
<h1>HUSTLE TO THE QUIZ</h1>
<p class="subtitle">Enter your details to continue</p>

<form id="loginForm">
<div class="group">
<label for="name">Name / Admin ID</label>
<input id="name" name="name" type="text" placeholder="Enter your name" maxlength="100" required autofocus>
</div>

<div class="group">
<label for="enrollment">Enrollment No. / Password</label>
<input id="enrollment" name="enrollment" type="text" placeholder="Enter enrollment number" maxlength="100" required>
</div>

<div class="group">
<label for="college">College</label>
<input id="college" name="college" type="text" placeholder="Enter your college name" maxlength="150">
</div>

<button id="submitBtn" type="submit">CONTINUE</button>
</form>

<div id="message" class="message"></div>

<p class="info">Students must enter their college name. Admin access does not require a college.</p>
</main>

<script>
const form=document.getElementById("loginForm");
const btn=document.getElementById("submitBtn");
const msg=document.getElementById("message");

function show(text,type){
  msg.textContent=text;
  msg.className="message show "+type;
}

form.addEventListener("submit",async e=>{
  e.preventDefault();
  msg.className="message";
  btn.disabled=true;
  btn.textContent="PLEASE WAIT...";

  try{
    const response=await fetch("/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        name:document.getElementById("name").value.trim(),
        enrollment:document.getElementById("enrollment").value.trim(),
        college:document.getElementById("college").value.trim()
      })
    });

    const result=await response.json();

    if(!response.ok || !result.success){
      show(result.message||"Unable to continue.","error");
      return;
    }

    window.location.href=result.redirect;
  }catch(error){
    show("Unable to connect to the server. Please try again.","error");
  }finally{
    btn.disabled=false;
    btn.textContent="CONTINUE";
  }
});
</script>
</body>
</html>
