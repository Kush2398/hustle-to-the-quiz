<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | HUSTLE TO THE QUIZ</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#071426;color:#eef4ff;font-family:Arial,Helvetica,sans-serif;display:grid;place-items:center}
.card{width:min(560px,92vw);background:#101f35;border:1px solid #29405f;border-radius:28px;padding:42px;box-shadow:0 25px 80px #0008}.pill{display:inline-block;background:#1b3555;padding:9px 14px;border-radius:99px;font-size:13px;font-weight:700;color:#cfe2ff}
h1{font-size:48px;line-height:.98;margin:28px 0 16px}p{color:#9fb2ce;line-height:1.6}.field{margin:14px 0}.field input{width:100%;height:54px;border:1px solid #385273;border-radius:13px;background:#edf4ff;color:#172238;padding:0 16px;font-size:16px;outline:none}.btn{width:100%;height:54px;border:0;border-radius:13px;background:#5d8df6;color:white;font-size:16px;font-weight:800;cursor:pointer;margin-top:8px}.msg{margin-top:14px;padding:13px;border-radius:12px;background:#4b1f2a;color:#ffbdc9;display:none}.hint{font-size:13px;text-align:center;margin-top:20px}</style></head>
<body><main class="card"><span class="pill">● GCET • LIVE EVENT SYSTEM</span><h1>HUSTLE<br>TO THE QUIZ</h1>
<p>One login. Five challenges. One leaderboard.</p>
<form id="login"><div class="field"><input id="loginName" autocomplete="name" placeholder="Name / Admin ID" required></div>
<div class="field"><input id="loginEnrollment" autocomplete="off" placeholder="Enrollment No. / Password" required></div>
<div class="field"><input id="loginCollege" placeholder="College"></div>
<button class="btn">CONTINUE →</button></form><div id="msg" class="msg"></div>
<p class="hint">Students enter name, enrollment and college. Admin uses the configured admin ID and password.</p></main>
<script>
const form=document.getElementById("login"),msg=document.getElementById("msg");
form.addEventListener("submit",async e=>{e.preventDefault();msg.style.display="none";
try{const r=await fetch("/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
name:document.getElementById("loginName").value.trim(),enrollment:document.getElementById("loginEnrollment").value.trim(),college:document.getElementById("loginCollege").value.trim()})});
const x=await r.json();if(!r.ok||!x.success)throw Error(x.message||"Login failed");location.href=x.redirect;
}catch(e){msg.textContent=e.message;msg.style.display="block"}});
</script></body></html>
