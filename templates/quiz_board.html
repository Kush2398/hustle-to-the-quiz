<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz Board | Hustle to the Quiz</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif;padding:35px}
.board{max-width:1200px;margin:auto}.top{text-align:center;margin-bottom:35px}.brand{font-size:22px;font-weight:700;letter-spacing:.5px}.status{font-size:16px;color:#666;margin-top:8px}.qnum{text-align:center;font-size:18px;color:#666;margin-bottom:15px}.question{text-align:center;font-size:42px;font-weight:700;line-height:1.25;max-width:1000px;margin:0 auto 40px;white-space:pre-wrap}
.options{display:grid;grid-template-columns:1fr 1fr;gap:20px}.option{min-height:150px;border:2px solid #ddd;border-radius:15px;padding:25px;display:flex;align-items:center;gap:20px}.symbol{font-size:52px;font-weight:700;min-width:75px;text-align:center}.text{font-size:25px;font-weight:600;line-height:1.3}.waiting{text-align:center;font-size:35px;font-weight:700;margin-top:18vh}.final-title{text-align:center;font-size:42px;font-weight:800;margin:5px 0 8px}.final-subtitle{text-align:center;color:#666;font-size:18px;margin-bottom:25px}.results-table-wrap{width:100%;overflow:auto}.results-table{width:100%;border-collapse:collapse}.results-table th,.results-table td{padding:14px 16px;border-bottom:1px solid #ddd;text-align:left;font-size:20px}.results-table th{font-size:15px;color:#666;letter-spacing:.5px}.results-table .rank{font-weight:800;width:90px}.results-table .score-cell{font-weight:800;text-align:right}.results-table th:last-child{text-align:right}.results-table .winner td{font-weight:800}
@media(max-width:800px){body{padding:20px}.question{font-size:30px}.options{grid-template-columns:1fr}.option{min-height:100px}.text{font-size:20px}.symbol{font-size:40px}}
</style>
</head>
<body>
<main class="board">
<header class="top"><div class="brand">HUSTLE TO THE QUIZ</div><div id="status" class="status">Waiting for quiz...</div></header>
<section id="content">
<div class="waiting">WAITING FOR THE NEXT QUESTION</div>
</section>
</main>
<script>
const symbols=["◆","●","▲","■"];
let showingFinal=false;

async function update(){
 try{
  const r=await fetch("/api/quiz/state");const x=await r.json();
  const content=document.getElementById("content");

  if(x.success&&x.active&&x.current_question){
   showingFinal=false;
   document.getElementById("status").textContent=`QUESTION ${x.current_number} OF ${x.total}`;
   const q=x.current_question;
   content.innerHTML=`
    <div class="qnum">${q.difficulty} • ${q.time_limit} seconds</div>
    <div class="question">${esc(q.question)}</div>
    <div class="options">
     ${q.options.map((o,i)=>`<div class="option"><div class="symbol">${symbols[i]}</div><div class="text">${esc(o)}</div></div>`).join("")}
    </div>`;
   return;
  }

  // The admin explicitly reveals results after the quiz finishes.
  if(!x.results_visible){
   showingFinal=false;
   document.getElementById("status").textContent="QUIZ FINISHED • RESULTS HIDDEN";
   content.innerHTML='<div class="waiting">QUIZ FINISHED<br><span style="font-size:18px;color:#666">Waiting for admin to show final results...</span></div>';
   return;
  }
  const rr=await fetch("/api/final-results");
  const fx=await rr.json();
  if(rr.ok&&fx.success){
   if(!showingFinal){
    renderFinalResults(content,fx.results,fx.total_questions);
    showingFinal=true;
   }
   document.getElementById("status").textContent="FINAL RESULTS";
   return;
  }

  showingFinal=false;
  document.getElementById("status").textContent="QUIZ NOT STARTED";
  content.innerHTML='<div class="waiting">WAITING FOR THE NEXT QUESTION</div>';
 }catch(e){}
}

function renderFinalResults(content,results,total){
 if(!results.length){
  content.innerHTML='<div class="waiting">NO PARTICIPANTS</div>';
  return;
 }
 content.innerHTML=`
  <div class="final-title">FINAL RESULTS</div>
  <div class="final-subtitle">${results.length} participants • ${total} questions</div>
  <div class="results-table-wrap">
   <table class="results-table">
    <thead><tr><th>RANK</th><th>STUDENT</th><th>ENROLLMENT</th><th>SCORE</th></tr></thead>
    <tbody>
     ${results.map(p=>`<tr class="${p.rank===1?'winner':''}"><td class="rank">${p.rank}</td><td>${esc(p.name)}</td><td>${esc(p.enrollment)}</td><td class="score-cell">${p.score} / ${total}</td></tr>`).join("")}
    </tbody>
   </table>
  </div>`;
}

function esc(v){const d=document.createElement("div");d.textContent=v??"";return d.innerHTML}
update();setInterval(update,700);
</script>
</body>
</html>
