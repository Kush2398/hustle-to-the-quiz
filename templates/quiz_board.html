<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz Board</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:#101828;font-family:Arial;padding:30px}.board{max-width:1200px;margin:auto}.top{text-align:center}.brand{font-size:24px;font-weight:900}.status{color:#667085;margin:8px}.q{font-size:44px;font-weight:900;text-align:center;line-height:1.25;margin:30px auto;max-width:1050px;white-space:pre-wrap}.options{display:grid;grid-template-columns:1fr 1fr;gap:18px}.option{border:2px solid #d0d5dd;border-radius:18px;min-height:150px;padding:24px;display:flex;align-items:center;gap:20px}.sym{font-size:54px;font-weight:900;min-width:70px}.txt{font-size:25px;font-weight:700}.wait{text-align:center;font-size:38px;font-weight:900;margin-top:20vh}.final{text-align:center}.final h1{font-size:48px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:15px;border-bottom:1px solid #ddd;font-size:20px;text-align:left}.table th{font-size:13px;color:#667085}.score{text-align:right!important;font-weight:900}@media(max-width:800px){.q{font-size:30px}.options{grid-template-columns:1fr}}
</style></head><body><main class="board"><header class="top"><div class="brand">HUSTLE TO THE QUIZ</div><div id="status" class="status">WAITING...</div></header><section id="content"><div class="wait">WAITING FOR THE NEXT EVENT</div></section></main>
<script>
let lastMode="";
function esc(v){const d=document.createElement("div");d.textContent=v??"";return d.innerHTML}
async function update(){try{const r=await fetch("/api/quiz/state"),x=await r.json();if(!x.success)return;
if(x.active&&x.current_question){lastMode="q";document.getElementById("status").textContent=`${x.event_name} • QUESTION ${x.current_number}/${x.total}`;let q=x.current_question;document.getElementById("content").innerHTML=`<div class="q">${esc(q.question)}</div><div class="options">${q.options.map((o,i)=>`<div class="option"><div class="sym">${["◆","●","▲","■"][i]}</div><div class="txt">${esc(o)}</div></div>`).join("")}</div>`;return}
if(x.results_visible){if(lastMode!=="final"){const rr=await fetch("/api/final-results"),f=await rr.json();if(f.success){lastMode="final";document.getElementById("status").textContent="FINAL RESULTS";document.getElementById("content").innerHTML=`<div class="final"><h1>🏆 FINAL RESULTS</h1><p>${esc(f.event_name)}</p><table class="table"><thead><tr><th>RANK</th><th>STUDENT</th><th>ENROLLMENT</th><th class="score">SCORE</th></tr></thead><tbody>${f.results.map(p=>`<tr><td><b>#${p.rank}</b></td><td>${esc(p.name)}</td><td>${esc(p.enrollment)}</td><td class="score">${p.score}</td></tr>`).join("")}</tbody></table></div>`}}return}
lastMode="wait";document.getElementById("status").textContent="WAITING";document.getElementById("content").innerHTML='<div class="wait">WAITING FOR THE NEXT EVENT</div>';
}catch(e){}}update();setInterval(update,800);
</script></body></html>
