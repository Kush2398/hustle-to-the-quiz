<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz Board | Hustle to the Quiz</title><style>
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;background:#fff;color:#111;font-family:Arial,Helvetica,sans-serif;padding:35px}.board{max-width:1250px;margin:auto}.top{text-align:center;margin-bottom:30px}.brand{font-size:22px;font-weight:800;letter-spacing:.5px}.status{font-size:16px;color:#666;margin-top:8px}.qnum{text-align:center;font-size:18px;color:#666;margin-bottom:15px}.question{text-align:center;font-size:42px;font-weight:700;line-height:1.25;max-width:1050px;margin:0 auto 40px;white-space:pre-wrap}.options{display:grid;grid-template-columns:1fr 1fr;gap:20px}.option{min-height:150px;border:2px solid #ddd;border-radius:15px;padding:25px;display:flex;align-items:center;gap:20px}.symbol{font-size:52px;font-weight:700;min-width:75px;text-align:center}.text{font-size:25px;font-weight:600;line-height:1.3}.waiting{text-align:center;font-size:35px;font-weight:700;margin-top:18vh}.final-title{text-align:center;font-size:46px;font-weight:900;margin-bottom:8px}.final-subtitle{text-align:center;color:#666;font-size:18px;margin-bottom:25px}.results-wrap{overflow:auto}.results{width:100%;border-collapse:collapse;min-width:700px}.results th,.results td{padding:15px 16px;border-bottom:1px solid #ddd;text-align:left;font-size:20px}.results th{font-size:14px;color:#666}.results .rank{font-weight:900;width:90px}.results .scorecell{font-weight:900;text-align:right}.results th:last-child{text-align:right}.winner td{font-weight:900}
@media(max-width:800px){body{padding:20px}.question{font-size:30px}.options{grid-template-columns:1fr}.option{min-height:100px}.text{font-size:20px}.symbol{font-size:40px}.final-title{font-size:34px}}
</style></head><body><main class="board"><header class="top"><div class="brand">HUSTLE TO THE QUIZ</div><div id="status" class="status">Waiting for quiz...</div></header><section id="content"><div class="waiting">WAITING FOR THE NEXT QUESTION</div></section></main><script>
let lastMode='';const symbols=['◆','●','▲','■'];const esc=v=>{const d=document.createElement('div');d.textContent=v??'';return d.innerHTML};
function renderFinal(results,total){let html='<div class="final-title">FINAL RESULTS</div><div class="final-subtitle">'+results.length+' participants • '+total+' questions</div><div class="results-wrap"><table class="results"><thead><tr><th>RANK</th><th>STUDENT</th><th>ENROLLMENT</th><th>SCORE</th></tr></thead><tbody>';results.forEach(p=>html+='<tr class="'+(p.rank===1?'winner':'')+'"><td class="rank">'+p.rank+'</td><td>'+esc(p.name)+'</td><td>'+esc(p.enrollment)+'</td><td class="scorecell">'+p.score+' / '+total+'</td></tr>');html+='</tbody></table></div>';document.getElementById('content').innerHTML=html}
async function update(){try{const r=await fetch('/api/quiz/state');const x=await r.json();if(!x.success)return;const c=document.getElementById('content');if(x.active&&x.current_question){const q=x.current_question;document.getElementById('status').textContent='QUESTION '+x.current_number+' OF '+x.total;lastMode='quiz';c.innerHTML='<div class="qnum">'+esc(q.difficulty)+' • '+q.time_limit+' seconds</div><div class="question">'+esc(q.question)+'</div><div class="options">'+q.options.map((o,i)=>'<div class="option"><div class="symbol">'+symbols[i]+'</div><div class="text">'+esc(o)+'</div></div>').join('')+'</div>';return}if(x.completed&&!x.active){const rr=await fetch('/api/final-results');const fx=await rr.json();if(fx.success){document.getElementById('status').textContent='FINAL RESULTS';if(lastMode!=='results'){renderFinal(fx.results,fx.total_questions);lastMode='results'}return}}lastMode='waiting';document.getElementById('status').textContent='QUIZ NOT STARTED';c.innerHTML='<div class="waiting">WAITING FOR THE NEXT QUESTION</div>'}catch(e){}}update();setInterval(update,700);
</script></body></html>
